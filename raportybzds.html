                suma: { l: 'Łącznie', s: 'Suma', hex: '#94a3b8' },
            };
            const ALL = ['allegro', 'amazon', 'emag', 'woo', 'reczne'];
            let co = 'DS', cf = 'all';

            /* ── Helpers ── */
            function sumaOnly(md) {
                for (const ps of Object.values(md)) for (const ch of Object.values(ps)) return 'suma' in ch;
                return false;
            }
            function ft(ch, f) {
                if ('suma' in ch) return ch.suma || 0;
                return f === 'all' ? ALL.reduce((s, k) => s + (ch[k] || 0), 0) : (ch[f] || 0);
            }
            function hl(text, q) {
                if (!q) return text;
                const idx = text.toLowerCase().indexOf(q);
                if (idx < 0) return text;
                return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
            }
            function num(v) { return (v || 0).toLocaleString('pl-PL'); }

            /* ── State setters ── */
            function setCo(c) {
                co = c;
                document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.co === c));
                fillPeriods(); render();
            }
            function setCh(ch) {
                cf = ch;
                document.querySelectorAll('.pill').forEach(b => b.classList.toggle('active', b.dataset.ch === ch));
                render();
            }
            function fillPeriods() {
                const sel = document.getElementById('perSel'), cur = sel.value;
                sel.innerHTML = '<option value="">Wybierz miesiąc…</option>';
                [...PERIODS].filter(p => DATA[co][p.key]).reverse().forEach(p => {
                    const o = document.createElement('option');
                    o.value = p.key; o.textContent = p.label;
                    if (p.key === cur) o.selected = true;
                    sel.appendChild(o);
                });
            }

            /* ── Render ── */
            function render() {
                const period = document.getElementById('perSel').value;
                const q = document.getElementById('srch').value.toLowerCase().trim();
                const cardsEl = document.getElementById('cards');
                const twrap = document.getElementById('twrap');
                const ttitle = document.getElementById('ttitle');
                const tmeta = document.getElementById('tmeta');
                const tfoot = document.getElementById('tfoot');
                const tcount = document.getElementById('tcount');

                if (!period) {
                    cardsEl.innerHTML = '';
                    twrap.innerHTML = '<div class="empty"><div class="empty-ico">📊</div><div class="empty-txt">Wybierz miesiąc</div><div class="empty-sub">Dane pojawią się tutaj</div></div>';
                    ttitle.textContent = 'Wybierz spółkę i miesiąc'; tmeta.textContent = ''; tfoot.style.display = 'none';
                    return;
                }
                const md = DATA[co][period];
                if (!md) { twrap.innerHTML = '<div class="empty"><div class="empty-txt">Brak danych</div></div>'; return; }
                const so = sumaOnly(md);

                const T = { allegro: 0, amazon: 0, emag: 0, woo: 0, reczne: 0, suma: 0 };
                for (const ps of Object.values(md)) for (const ch of Object.values(ps)) for (const [k, v] of Object.entries(ch)) T[k] = (T[k] || 0) + v;
                const grand = so ? T.suma : ALL.reduce((s, k) => s + (T[k] || 0), 0);
                const fgrand = so ? T.suma : (cf === 'all' ? grand : (T[cf] || 0));
                const pObj = PERIODS.find(p => p.key === period);
                const cName = co === 'DS' ? 'SHAV (DS)' : 'BlendyGo (BZ)';

                /* Cards */
                let cards = '';
                if (so) {
                    cards = `<div class="card"><div class="card-accent" style="background:#94a3b8"></div><div class="card-lbl">Łącznie</div><div class="card-val">${num(grand)}</div><div class="card-sub">Brak podziału na kanały</div></div>`;
                } else {
                    for (const k of ALL) {
                        const v = T[k] || 0, pct = grand > 0 ? Math.round(v / grand * 100) : 0;
                        const active = cf === 'all' || cf === k;
                        cards += `<div class="card clickable${active ? '' : ' dim'}" data-setc="${k}">
        <div class="card-accent" style="background:${CH[k].hex}"></div>
        <div class="card-lbl">${CH[k].l}</div>
        <div class="card-val">${num(v)}</div>
        <div class="card-sub">${pct}% całości</div>
        <div class="pbar-bg"><div class="pbar" style="width:${pct}%;background:${CH[k].hex}"></div></div>
      </div>`;
                    }
                    const chLbl = cf === 'all' ? 'wszystkie kanały' : CH[cf]?.l || cf;
                    cards += `<div class="card clickable" data-setc="all" style="border-color:var(--ds)">
      <div class="card-accent" style="background:var(--ds)"></div>
      <div class="card-lbl">Łącznie</div>
      <div class="card-val" style="color:var(--ds)">${num(fgrand)}</div>
      <div class="card-sub">${chLbl}</div>
    </div>`;
                }
                cardsEl.innerHTML = cards;

                const chLbl = cf === 'all' ? 'wszystkie kanały' : CH[cf]?.l || cf;
                ttitle.textContent = `${cName} — ${pObj?.label || period}`;
                tmeta.textContent = `Kanał: ${chLbl} · ${Object.keys(md).length} krajów`;
                tfoot.style.display = '';

                const cols = so ? [{ k: 'suma', l: 'Suma' }] : cf === 'all' ? ALL.map(k => { return { k, l: CH[k].s } }) :
                    [{ k: cf, l: CH[cf].l }];

                /* Search mode */
                if (q.length > 0) {
                    const rows = [];
                    for (const [ctry, ps] of Object.entries(md))
                        for (const [name, ch] of Object.entries(ps))
                            if (name.toLowerCase().includes(q)) rows.push({ ctry, name, ch });
                    rows.sort((a, b) => ft(b.ch, cf) - ft(a.ch, cf));
                    tcount.textContent = `${rows.length} wyników`;
                    if (rows.length === 0) {
                        twrap.innerHTML = '<div class="empty"><div class="empty-txt">Brak wyników</div><div class="empty-sub">Spróbuj innego hasła</div></div>';
                        return;
                    }
                    const fT = {}; cols.forEach(c => fT[c.k] = 0);
                    rows.forEach(r => cols.forEach(c => fT[c.k] = (fT[c.k] || 0) + (r.ch[c.k] || 0)));
                    const fSum = cols.reduce((s, c) => s + (fT[c.k] || 0), 0);
                    const thC = cols.map(c => `<th class="${cf === c.k ? 'ach' : ''}">${c.l}</th>`).join('');
                    const tdT = cols.map(c => `<td class="ach">${num(fT[c.k])}</td>`).join('');
                    let html = `<table><thead>
      <tr class="labels"><th>Produkt</th><th>Kraj</th>${thC}<th>Razem</th></tr>
      <tr class="totals"><td colspan="2">Suma wyników (${rows.length} prod.)</td>${tdT}<td>${num(fSum)}</td></tr>
      </thead><tbody>`;
                    for (const r of rows) {
                        const t = ft(r.ch, cf);
                        const tdC = cols.map(c => { const v = r.ch[c.k] || 0; return `<td class="${cf === c.k ? 'ach' : ''}${v ? '' : ' z'}">${v || ''}</td>`; }).join('');
                        html += `<tr class="grow"><td>${hl(r.name, q)}</td><td class="ctry">${r.ctry}</td>${tdC}<td>${num(t)}</td></tr>`;
                    }
                    twrap.innerHTML = html + '</tbody></table>';
                    return;
                }

                tcount.textContent = '';

                /* Normal tree mode */
                const ctryT = {};
                for (const [c, ps] of Object.entries(md)) ctryT[c] = Object.values(ps).reduce((s, ch) => s + ft(ch, cf), 0);
                const maxC = Math.max(...Object.values(ctryT), 1);
                const thC = cols.map(c => `<th class="${!so && cf === c.k ? 'ach' : ''}" style="${!so && cf === c.k ? 'color:' + CH[c.k]?.hex : ''}">${c.l}</th>`).join('');
                const tdT = cols.map(c => `<td>${num(T[c.k] || 0)}</td>`).join('');
                let html = `<table><thead>
    <tr class="labels"><th>Kraj / Produkt</th>${thC}<th>Razem</th></tr>
    <tr class="totals"><td>Wszystkie kraje</td>${tdT}<td>${num(fgrand)}</td></tr>
    </thead><tbody>`;
                const sorted = Object.keys(md).sort((a, b) => ctryT[b] - ctryT[a]);
                for (const ctry of sorted) {
                    const ps = md[ctry], ct = ctryT[ctry];
                    if (ct === 0 && cf !== 'all') continue;
                    const cT = {};
                    for (const ch of Object.values(ps)) for (const [k, v] of Object.entries(ch)) cT[k] = (cT[k] || 0) + v;
                    const gid = 'g' + ctry.replace(/\W/g, '') + '_' + period;
                    const bw = Math.round(ct / maxC * 64);
                    const tdC = cols.map(c => { const v = cT[c.k] || 0; return `<td class="${!so && cf === c.k ? 'ach' : ''}">${v || ''}</td>`; }).join('');
                    html += `<tr class="crow" data-gid="${gid}">
      <td><span class="chv">▶</span>${ctry} <span style="font-size:11px;color:var(--muted);font-weight:400">(${Object.keys(ps).length})</span></td>
      ${tdC}
      <td style="white-space:nowrap"><span class="ibar" style="width:${bw}px"></span>${num(ct)}</td>
    </tr>`;
                    const sp = Object.entries(ps).sort((a, b) => ft(b[1], cf) - ft(a[1], cf));
                    for (const [name, ch] of sp) {
                        const pt = ft(ch, cf);
                        if (pt === 0 && cf !== 'all') continue;
                        const tdP = cols.map(c => { const v = ch[c.k] || 0; return `<td class="${!so && cf === c.k ? 'ach' : ''}${v ? '' : ' z'}">${v || ''}</td>`; }).join('');
                        html += `<tr class="prow" data-g="${gid}"><td>${name}</td>${tdP}<td>${num(pt) || ''}</td></tr>`;
                    }
                }
                twrap.innerHTML = html + '</tbody></table>';
            }

            /* ── Event listeners (no onclick attributes — WordPress safe) ── */
            document.querySelectorAll('.seg-btn[data-co]').forEach(function (btn) {
                btn.addEventListener('click', function () { setCo(btn.dataset.co); });
            });
            document.querySelectorAll('.pill[data-ch]').forEach(function (btn) {
                btn.addEventListener('click', function () { setCh(btn.dataset.ch); });
            });
            document.getElementById('perSel').addEventListener('change', render);
            document.getElementById('srch').addEventListener('input', render);

            /* Card clicks — delegated because cards are re-rendered */
            document.getElementById('cards').addEventListener('click', function (e) {
                const card = e.target.closest('[data-setc]');
                if (card) setCh(card.dataset.setc);
            });

            /* Country row clicks — delegated */
            document.getElementById('twrap').addEventListener('click', function (e) {
                const crow = e.target.closest('tr.crow');
                if (crow) {
                    const gid = crow.dataset.gid;
                    crow.classList.toggle('open');
                    document.querySelectorAll('[data-g="' + gid + '"]').forEach(function (r) { r.classList.toggle('open'); });
                }
            });

            /* Init */
            fillPeriods();
            const sel = document.getElementById('perSel');
            const first = sel.querySelector('option[value]:not([value=""])');
            if (first) { sel.value = first.value; render(); }

        })();
    </script>
</body>

</html>
<?php
    return ob_get_clean();
});
