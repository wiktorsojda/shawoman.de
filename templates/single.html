}
.blog-single-sidebar-categories li a:hover::before {
  transform: translateX(2px) rotate(90deg) scale(1.2);
}
.blog-single-sidebar-categories li:last-child a {
  border-bottom: none;
}

/* --- Recommended Posts --- */
.blog-single-recommended-list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.blog-single-recommended-list li {
  background: #F2F2F2;
  border-radius: 16px; /* match blogindex cards */
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.06);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  display: flex;
  flex-direction: column;
  padding: 0;
}
.blog-single-recommended-list li:hover {
  transform: translateY(-4px);
  box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.12);
}

.blog-single-recommended-img {
  width: 100%;
  aspect-ratio: 16/10;
  overflow: hidden;
  margin: 0 !important;
  border-radius: 0 !important;
}
.blog-single-recommended-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease-out;
  border-radius: 0 !important;
}
.blog-single-recommended-img:hover img {
  transform: scale(1.02);
}

.blog-single-recommended-content-wrap {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.blog-single-recommended-title {
  margin: 0 0 1rem 0 !important;
  font-size: 1.2rem;
  line-height: 1.4;
}
.blog-single-recommended-title a {
  color: #111;
  text-decoration: none;
  transition: color 0.3s ease;
}
.blog-single-recommended-title a:hover {
  color: #111111;
}

.blog-single-recommended-date {
  color: #8C8C8C; /* $Grey500 */
  font-size: 0.9rem;
  font-weight: 500;
  margin: 0 !important;
}

@media (max-width: 900px) {
  .blog-single-sidebar-widget {
    padding: 1.5rem !important;
    margin-top: 2rem;
  }
  .blog-single-recommended-list {
    grid-template-columns: 1fr !important;
    gap: 2rem !important;
  }
}
/* --- Breadcrumbs (Return to blog button) --- */
.blog-breadcrumbs {
  margin-bottom: 2rem;
  padding: 0 1rem;
}
.blog-breadcrumbs a.blog-back-btn {
  display: inline-flex;
  align-items: center;
  color: #464646; /* Szary700 */
  text-decoration: none;
  font-weight: 600;
  font-size: 1.1rem;
  transition: all 0.2s ease;
}
.blog-breadcrumbs a.blog-back-btn:hover {
  color: #111111;
  transform: translateX(-5px);
}

/* --- Sticky Sidebar Column --- */
.sticky-column {
  position: sticky;
  top: 120px;
  align-self: flex-start;
}

/* --- Post Navigation Links --- */
.post-navigation-group {
  align-items: stretch !important;
}
.wp-block-post-navigation-link {
  flex: 1;
  display: flex;
}
.wp-block-post-navigation-link a {
  flex: 1;
  display: flex;
  align-items: center; /* Wyrównanie strzałki i tekstu w równej linii */
  padding: 10px 16px;
  background-color: transparent; 
  color: #111111 !important;
  border: 1px solid transparent;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  font-size: clamp(0.85rem, 1.5vw, 1.05rem); /* Zwiększony font */
  line-height: 1.4;
  transition: all 0.3s ease;
  gap: 10px;
}
@media (hover: hover) and (pointer: fine) {
  .wp-block-post-navigation-link a:hover {
    background-color: transparent;
    color: #333333 !important; /* Ciemniejszy odcień pomarańczowego */
  }
}
.post-navigation-link-previous a {
  justify-content: flex-start;
  text-align: left;
}
.post-navigation-link-next a {
  justify-content: flex-end;
  text-align: right;
}
.post-navigation-link-next a::after {
  content: "\2192"; /* Strzałka w prawo */
  flex-shrink: 0;
  font-size: 1rem;
}
.post-navigation-link-previous a::before {
  content: "\2190"; /* Strzałka w lewo */
  flex-shrink: 0;
  font-size: 1rem;
}
@media (max-width: 768px) {
  .wp-block-post-navigation-link {
    width: 100%;
    margin-bottom: 0.5rem;
    flex: none;
  }
  .post-navigation-link-next a {
    justify-content: flex-start;
    text-align: left;
  }
}

/* --- Single Post Hero Overlay --- */
.blog-single-hero {
  position: relative;
  margin-bottom: 3rem;
  border-radius: 20px;
  overflow: hidden;
}
.blog-single-hero figure, 
.blog-single-hero img {
  margin: 0 !important;
  width: 100%;
  height: auto;
  display: block;
}
.blog-single-hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 5rem 3rem 2.5rem;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  pointer-events: none;
}
.blog-single-hero-overlay h1, 
.blog-single-hero-overlay .wp-block-post-title {
  color: #FFF !important;
  margin-bottom: 0.5rem;
  text-shadow: 0px 2px 10px rgba(0,0,0,0.3);
  font-size: clamp(2rem, 3.5vw, 3.2rem) !important;
  font-weight: 700;
  line-height: 1.2;
}
.blog-single-hero-overlay .wp-block-post-date {
  color: rgba(255, 255, 255, 0.85) !important;
  font-size: 1rem;
  margin-top: 0;
}
.blog-hero-back-btn {
  position: absolute;
  top: 2rem;
  left: 2.5rem;
  z-index: 1;
  color: #FFF !important;
  background: rgba(0,0,0,0.4);
  padding: 10px 20px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 500;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.2);
}
.blog-hero-back-btn:hover {
  background: #111111;
  border-color: #111111;
}
@media (max-width: 768px) {
  .blog-single-hero {
    border-radius: 0;
    margin-bottom: 2rem;
  }
  .blog-single-hero figure,
  .blog-single-hero img {
    margin-left: calc(50% - 50vw) !important;
    margin-right: calc(50% - 50vw) !important;
    width: 100vw !important;
    max-width: 100vw !important;
    border-radius: 0 !important;
  }
  .blog-single-hero-overlay {
    position: static;
    background: none;
    padding: 1rem 0 0;
  }
  .blog-single-hero-overlay h1, 
  .blog-single-hero-overlay .wp-block-post-title {
    color: #111 !important;
    text-shadow: none;
    font-size: clamp(1.8rem, 6vw, 2.2rem) !important;
  }
  .blog-single-hero-overlay .wp-block-post-date {
    color: #666 !important;
  }
  .blog-hero-back-btn {
    top: 1rem;
    left: 1rem;
    font-size: 0.85rem;
    padding: 8px 16px;
  }
}

/* Force sticky to work by overriding wp-site-blocks */
.wp-site-blocks {
  overflow: unset !important;
}

/* --- Sidebar Back Button --- */
.blog-sidebar-back-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #F2F2F2;
  border-radius: 16px;
  padding: 1.5rem 2.5rem;
  border-radius: 20px;
  box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.04);
  color: #111111;
  text-decoration: none;
  font-weight: 600;
  font-size: 1.05rem;
  margin-top: 1.5rem;
  transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
  opacity: 0;
  transform: translateY(15px);
  pointer-events: none;
  border: 1px solid rgba(0, 0, 0, 0.1);
}
.blog-sidebar-back-btn.is-visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.blog-sidebar-back-btn:hover {
  background: #111111;
  color: #FFF;
  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
}
@media (max-width: 768px) {
  .blog-sidebar-back-btn {
    display: none !important;
  }
}
</style>
